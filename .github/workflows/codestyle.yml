name: Code Style

on:
    pull_request:

permissions:
    contents: read

jobs:
    prettier:
        name: Prettier
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            # This repository does not commit a lockfile.
            - name: Install dependencies
              run: npm install --no-audit --no-fund
            - name: Run Prettier
              run: npm run cs
